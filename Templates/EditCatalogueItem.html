<!DOCTYPE html>
<html lang="en">
<head>
<link rel="shortcut icon" type="image/x-icon" href="static/favicon.ico">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NuBuild Edit Item</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* Header */
.header {
  display: flex;
  align-items: center;
  padding: 12px;
  background: #ffffff;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.back-btn {
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
}

/* Content */
.container {
  padding: 16px;
  flex: 1;
  margin-bottom: 50px;
}

.card {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.field {
  margin-bottom: 12px;
}

.label {
  font-size: 14px;
  color: #666;
}

.value {
  font-size: 18px;
  font-weight: bold;
}

/* Input section */
.update-section {
  display: flex;
  gap: 8px;
}

input {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ddd;
  font-size: 16px;
}

.update-btn {
  background: #0078D4;
  color: white;
  border: none;
  padding: 10px 14px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

.submit-btn {
  background: #51F59F;
  color: white;
  border: none;
  padding: 10px 14px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  text-align: center;
}

.edit-btn {
    background-color: #ef4444;
    border: none;
    padding: 6px 10px;
    color: white;
    cursor: pointer;
    border-radius: 4px;
}

.edit-btn:hover {
    background-color: #dc2626;
}

.error-message {
  font-size: 14px;
  color: #ff0000;
}

.success-message {
  font-size: 14px;
  color: #00ff00;
}

.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 60px;
  background-color: #333;
  color: white;
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: 1000;
  background: #ffffff;
}

.action-btn {
  flex: 1;
  margin: 0 4px;
  padding: 10px;
  border: none;
  border-radius: 10px;
  font-size: 12px;
  color: white;
  cursor: pointer;
}

.child-list {
list-style: none;
padding: 0;
}

.child-item {
display: flex;
justify-content: space-between;
align-items: center;
padding: 10px;
border-bottom: 1px solid #ddd;
}

.child-item:last-child {
border-bottom: none;
}

.site-header {
            color: #000;
            padding: 20px 15px;
			font-size: 20px;
        }
		
.receive { background: #28a745; }
.move { background: #dc3545; }
.stage { background: #ffc107; color: black; }
.qr { background: #17a2b8; }

@media (max-width: 480px) {
  .value {
    font-size: 16px;
  }
}
</style>
</head>

<body>
{% include "Header.html" %}

<div class="container">

  <div class="card">
	<div class="site-header">Edit Catalogue Item</div>
  
    <div class="field">
      <div class="label">Item Type</div>
		<input type="text" id="item_type_input" onkeyup="" placeholder="E.g. Spade">
    </div>
  
    <div class="field">
      <div class="label">Supplier</div>
		<input type="text" id="supplier_input" onkeyup="" placeholder="E.g. Sega">
    </div>
  
    <div class="field">
		<div class="label">Item ID</div>
		<input type="text" id="item_id_input" onkeyup="" placeholder="E.g. 01NA0001">
    </div>
	
    <div class="field">
		<div class="label">MPN</div>
		<input type="text" id="mpn_input" onkeyup="" placeholder="E.g. GDE1106">
    </div>
	
    <div class="field">
		<div class="label">Description</div>
		<input type="text" id="description_input" onkeyup="" placeholder="">
    </div>
	
    <div class="field">
		<div class="label">Shorthand</div>
		<input type="text" id="shorthand_input" onkeyup="" placeholder="E.g. 16 Grommet, 16way, etc.">
    </div>
	
	
	{% if item_obj.correct_item %}
      <div class="update-btn" id="correctItem" onclick="window.location.assign('/?obj_id={{item_obj.correct_item}}');">{{item_obj.get_item.display_name}}</div>
	{% endif %}
	
	<div class="error-message" id="receive_error">Please make sure all inputs are filled.</div>
	<div class="success-message" id="receive_success">Edit successful.</div>
	<div class="submit-btn" id="submit_button" onclick="submitReceive()">Submit</div>

</div>

<div class="bottom-bar">
</div>

<script>
function handleButtonUrl(action, open_new_window) {
			if (open_new_window) {
				window.open(action, '_blank');
			} else {
				window.location.href = action
			}
        }
		
function showChildSite(display_name, site_id) {
	const element = document.getElementById("ExampleChild");
	const new_elem = element.cloneNode(true);
	element.after(new_elem);
}

function display_generic_error(error_text) {
  const error_elem = document.getElementById("receive_error");
  error_elem.textContent = error_text;
  error_elem.style.display = "";
  
  hide_all_successes();
}

function display_generic_success(success_text) {
  const success_elem = document.getElementById("receive_success");
  success_elem.textContent = success_text;
  success_elem.style.display = "";
  
  hide_all_errors();
}
		
async function submitReceive() {
console.log("Attempting to edit catalogue item.");
	const item_obj_id = "{{item_obj.id}}";
	const item_type_elem = document.getElementById("item_type_input");
	const supplier_elem = document.getElementById("supplier_input");
	const item_id_elem = document.getElementById("item_id_input");
	const mpn_elem = document.getElementById("mpn_input");
	const description_elem = document.getElementById("description_input");
	const shorthand_elem = document.getElementById("shorthand_input");
	console.log(item_type_elem.value);
	console.log(supplier_elem.value);
	console.log(item_id_elem.value);
	console.log(mpn_elem.value);
	console.log(description_elem.value);
	console.log(shorthand_elem.value);
	
	const data = {
	"item_id": item_obj_id,
	"item_type": item_type_elem.value,
	"supplier": supplier_elem.value,
	"provided_item_id": item_id_elem.value,
	"mpn": mpn_elem.value,
	"description": description_elem.value,
	"shorthand": shorthand_elem.value
	};
	let ret = await patch_request("/api/editCatalogueItem", data);
	let response_data = await ret.json();
	
	if (!ret.ok) {
		console.log("Displaying error " + response_data['error']);
		display_generic_error(response_data['error']);
	} else {
		display_generic_success("Creation successful!");
		//history.back();
		window.location.replace(document.referrer);
	}
	
	console.log(response_data);
}

{% include "Request.js" %}
  
function hide_all_errors() {
error_elems = document.getElementsByClassName("error-message");
for (i = 0; i < error_elems.length; i++) {
	a = error_elems[i];
	a.style.display = "none";
}
}
  
function hide_all_successes() {
error_elems = document.getElementsByClassName("success-message");
for (i = 0; i < error_elems.length; i++) {
	a = error_elems[i];
	a.style.display = "none";
}
}

hide_all_errors();
hide_all_successes();
</script>

</body>
</html>
