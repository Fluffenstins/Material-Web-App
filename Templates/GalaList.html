<!DOCTYPE html>
<html lang="en">
<head>
<link rel="shortcut icon" type="image/x-icon" href="static/favicon.ico">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NuBuild Log Work</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}




.site-header {
            color: #000;
            padding: 20px 15px;
			font-size: 20px;
        }
		

.submit-btn {
  background: #51F59F;
  color: white;
  border: none;
  padding: 10px 14px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  text-align: center;
}

.label {
  font-size: 14px;
  color: #666;
}

input {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ddd;
  font-size: 16px;
  margin-bottom: 20px;
}

.long-input {
	width: 50vw;
	height: 50px;
	margin-bottom: 20px;
	text-wrap: wrap;
	  flex: 1;
	  padding: 10px;
	  border-radius: 8px;
	  border: 1px solid #ddd;
	  font-size: 16px;
	  margin-bottom: 20px;
}

.fake-input {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ddd;
  font-size: 16px;
  background-color: #bbbbbb;
  margin-bottom: 20px;
}

.container {
  padding: 16px;
  flex: 1;
  margin-bottom: 50px;
}

.card {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}


.flex-container {
  display: flex;
  /*gap: 20px;  Optional: adds space between the columns */
}

.column {
  flex: 1; /* Makes both columns take up equal width */
}

@media (max-width: 767px) {
	.flex-container {
	  flex-direction: column;
	}
}
	
.page-header {
    text-align: center;
    margin-bottom: 30px;
}

.page-header h1 {
    margin: 10;
    font-size: 3rem;
    font-weight: 700;
    color: #1e40af;
}

.page-header p {
    margin-top: 8px;
    font-size: 1.1rem;
    color: #64748b;
}

.field {
  margin-bottom: 12px;
}

.label {
  font-size: 14px;
  color: #666;
}

.value {
  font-size: 18px;
  font-weight: bold;
}
		
</style>
</head>

<body>
{% include "Header.html" %}


<div class="page-header">
    <h1>Gala Registration List</h1>
</div>
<div class="container">

	<div class="card">
	
		<div class="flex-container">
		<div class="column">
		  
			<div class="field">
				<div class="label">Checked In</div>
				<div class="value">{{checked_in_total}}</div>
			</div>
		  
			<div class="field">
				<div class="label">Remaining</div>
				<div class="value">{{remaining_total}}</div>
			</div>
		</div>
		<div class="column">
		  
			<div class="field">
				<div class="label">Partially Checked In</div>
				<div class="value">{{partially_checked_in_total}}</div>
			</div>
		  
			<div class="field">
				<div class="label">Checked Out</div>
				<div class="value">{{checked_out_total}}</div>
			</div>
		</div>
		</div>
	</div>
	<div class="card">
		{% set table_id, table_data = "table_1", tickets %}
		{% include "SearchableSubitemsTable.html" %}

	</div>
</div>


<script>



</script>

</body>
</html>
