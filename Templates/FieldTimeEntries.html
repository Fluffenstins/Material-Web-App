<!DOCTYPE html>
<html lang="en">
<head>
<link rel="shortcut icon" type="image/x-icon" href="static/favicon.ico">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NuBuild Time Entries</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  
}

.header {
  font-size: 2rem; 
  display: flex;
  align-items: center;
  padding: 12px;
}

.container {
  padding: 16px;
  flex: 1;
  margin-bottom: 50px;
}

.field {
  margin-bottom: 12px;
}

.action-button {
	cursor: pointer;
}

.add-entry {
	background-color: #555555;
}

.add-entry-button {
	width: 100%;
	height: 40px;
	line-height: 40px; 
	text-align: center;
	border-radius: 12px;
	border: 1px solid #ccc;
	background-color: #77ee77;
	cursor: pointer;
}

</style>
</head>

<body>
{% include "Header.html" %}

<div class="container">


    <div class="field">
		<div class="header">Time Entries</div>
		<div class="add-entry-button" onclick='handle_button_redirect("/addTimeEntry?project_id={{project_obj.id}}")'>Add Entry</div>
	{% set table_id, table_data = "table_1", time_entry_table %}
	{% include "EditableSubitemsTable.html" %}
	
    </div>

</div>


<script>

function handle_button_redirect(url) {
	window.location.href = url;
}

</script>

</body>
</html>
