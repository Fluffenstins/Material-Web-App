<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Under Maintenance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        h1 {
            margin-bottom: 15px;
            color: #2c3e50;
        }

        p {
            margin-bottom: 10px;
            line-height: 1.6;
        }

        .footer {
            margin-top: 25px;
            font-size: 0.9rem;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔧</div>

        <h1>We'll Be Back Soon</h1>

        <p>
            Sorry for the inconvenience. We're currently performing scheduled maintenance.
        </p>

        <p>
            Please check back shortly.
        </p>

        <div class="footer">
            NuBuild Site Maintenance
        </div>
    </div>
</body>
</html>
