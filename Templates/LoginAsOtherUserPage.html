<!DOCTYPE html>
<html lang="en">
<head>
<link rel="shortcut icon" type="image/x-icon" href="static/favicon.ico">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NuBuild Edit Item</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}




.site-header {
            color: #000;
            padding: 20px 15px;
			font-size: 20px;
        }
		

.submit-btn {
  background: #51F59F;
  color: white;
  border: none;
  padding: 10px 14px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  text-align: center;
}


input {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ddd;
  font-size: 16px;
}

.container {
  padding: 16px;
  flex: 1;
  margin-bottom: 50px;
}

.card {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
		
</style>
</head>

<body>
{% include "Header.html" %}

<div class="container">

  <div class="card">
	<div class="site-header">Login as Other User</div>
	{% with search_list_id="possible_users", item_type="Name", material_children=possible_users, hide_by_default=false%}
			{% include "SimpleDropdown.html" %}
			{% endwith %}
	<div class="submit-btn" id="submit_button" onclick="submitLogin()">Login</div>

</div>

<script>

function submitLogin() {
	email_elem = document.getElementById('possible_users_input');
	email = email_elem.value;
	window.location.href = "/loginAsUser?target_id=" + email
}

</script>

</body>
</html>
