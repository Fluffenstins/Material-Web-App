<!DOCTYPE html>
<html lang="en">
<head>
<link rel="shortcut icon" type="image/x-icon" href="static/favicon.ico">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Action Item</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}


/* Content */
.container {
  padding: 16px;
  flex: 1;
  margin-bottom: 50px;
}

.card {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.field {
  margin-bottom: 12px;
}

.label {
  font-size: 14px;
  color: #666;
}

.value {
  font-size: 18px;
  font-weight: bold;
}

/* Input section */


input {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ddd;
  font-size: 16px;
}

textarea {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ddd;
  font-size: 16px;
  width: 70%;
}

.update-btn {
  background: #0078D4;
  color: white;
  border: none;
  padding: 10px 14px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 60px;
  background-color: #333;
  color: white;
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: 1000;
  background: #ffffff;
}

.action-btn {
  flex: 1;
  margin: 0 4px;
  padding: 10px;
  border: none;
  border-radius: 10px;
  font-size: 12px;
  color: white;
  cursor: pointer;
}

.qr { background: #17a2b8; }
.add { background: #28a745; }

@media (max-width: 480px) {
  .value {
    font-size: 16px;
  }
}
</style>
</head>

<body>

{% include "Header.html" %}

<div class="container">

  <div class="card">
    <div class="field">
		<div class="label">New Comment</div>
		<textarea id="comment_inp" name="comment" placeholder="Enter your comments here..." rows="5" width="80%"></textarea>
		<br>
		<div class="error-message" id="receive_error">Please type a comment.</div>
		<div class="success-message" id="receive_success">Comment successful.</div>
		<button class="action-btn add" type="button" onclick="create_new_comment()">Add</button>
    </div>
	
  </div>
  
	{% for comment in comment_objs %}
	<div class="card">
        <div class="field">
		  <div class="label">{{comment.lookup(comment.user).display_name}}</div>
		  <div class="value" id="mpn">{{comment.text}}</div>
		</div>
	</div>
	{% endfor %}
	
</div>

  


<div class="bottom-bar">
  <button class="action-btn qr"  onclick="window.open('{{qr_code_url}}', '_blank')">Get QR Code</button>
</div>

<script>
async function create_new_comment() {
	let comment_inp = document.getElementById("comment_inp");
	let url = "/api/createComment";
	const data = {
	"text": comment_inp.value,
	"parent_id": "{{parent_obj.id}}"
	};
	let ret = await post_request(url, data);
	let response_data = await ret.json();
	
	if (!ret.ok) {
		console.log("Displaying error " + response_data['error']);
		display_generic_error(response_data['error']);
	} else {
		display_generic_success("Comment added!");
		//history.back();
		window.location.reload();
	}
	
	console.log(response_data);
}


function display_generic_error(error_text) {
  const error_elem = document.getElementById("receive_error");
  error_elem.textContent = error_text;
  error_elem.style.display = "";
  
  hide_all_successes();
}

function display_generic_success(success_text) {
  const success_elem = document.getElementById("receive_success");
  success_elem.textContent = success_text;
  success_elem.style.display = "";
  
  hide_all_errors();
}
		
function hide_all_errors() {
error_elems = document.getElementsByClassName("error-message");
for (i = 0; i < error_elems.length; i++) {
	a = error_elems[i];
	a.style.display = "none";
}
}
  
function hide_all_successes() {
error_elems = document.getElementsByClassName("success-message");
for (i = 0; i < error_elems.length; i++) {
	a = error_elems[i];
	a.style.display = "none";
}
}

{% include "Request.js" %}

hide_all_errors();
hide_all_successes();

</script>

</body>
</html>
