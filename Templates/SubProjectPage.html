<!DOCTYPE html>
<html lang="en">
<head>
<link rel="shortcut icon" type="image/x-icon" href="static/favicon.ico">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NuBuild Site</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  
}

/* Header */
.header {
  display: flex;
  align-items: center;
  padding: 12px;
  background: #ffffff;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.back-btn {
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
}

/* Content */
.container {
  padding: 16px;
  flex: 1;
  margin-bottom: 50px;
}

.card {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.field {
  margin-bottom: 12px;
}

.label {
  font-size: 0.9rem;
  color: #666;
}

.value {
  font-size: 1.25rem;
  color: #000;
}

.action-btn {
  font-size: 1.25rem;
  flex: 1;
  margin: 0 4px;
  padding: 30px;
  border: none;
  border-radius: 10px;
  color: black;
  cursor: pointer;
  margin: 10px;
}

.time-entry {background-color: #35ab3f;}

.work-logs {background-color: #ff9d52;}

.material {background-color: #ff5e74;}

.files {background-color: #809bff;}

.flex-container {
  display: flex;
  gap: 20px; /* Optional: adds space between the columns */
}

.column {
  flex: 1; /* Makes both columns take up equal width */
}
</style>
</head>

<body>
{% include "Header.html" %}

<div class="container">

  <div class="card">

	<div class="flex-container">
		<div class="column">
			<div class="field">
			  <div class="label">NuBuild ID</div>
			  <div class="value" id="siteId">{{project_obj.nb_id}}</div>
			</div>
			<div class="field">
			  <div class="label">Customer ID</div>
			  <div class="value" id="siteId">{{project_obj.customer_id}}</div>
			</div>
		</div>
		
		<div class="column">
		</div>
	</div>
	
</div>

	
<div class="card">
	<div class="action-btn time-entry">Time Entries</div>
	<div class="action-btn work-logs">Work Logs</div>
	<div class="action-btn material">Material</div>
	<div class="action-btn files">Files</div>
</div>

</div>
<script>
</script>

</body>
</html>
