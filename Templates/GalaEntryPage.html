<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSVP Confirmation</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: white;
        padding: 20px;
    }

    .container {
        text-align: center;
        background: rgba(255,255,255,0.08);
        backdrop-filter: blur(12px);
        padding: 40px;
        border-radius: 24px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.35);
        max-width: 500px;
        width: 100%;
    }

    h1 {
        font-size: 2.2rem;
        margin-bottom: 12px;
        color: #ffffff;
    }

    p {
        color: #d1d5db;
        line-height: 1.6;
        margin-bottom: 30px;
    }

    .qr-wrapper {
        margin: 20px 0 30px;
    }

    .qr-code {
        width: 260px;
        max-width: 100%;
        border-radius: 18px;
        background: white;
        padding: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }

    .download-btn {
        display: inline-block;
        margin-top: 20px;
        padding: 14px 30px;
        background: #22c55e;
        color: white;
        text-decoration: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        transition: all 0.25s ease;
    }

    .download-btn:hover {
        background: #16a34a;
        transform: translateY(2px);
    }

    .footer {
        margin-top: 25px;
        font-size: 0.9rem;
        color: #94a3b8;
    }
</style>
</head>
<body>

<div class="container">
    <h1>✅ Thank You for RSVPing!</h1>

    <p>
        We're excited to see you at the gala. Please save the QR code below and present it at check-in.
    </p>

    <div class="qr-wrapper">
        <img
            id="qrCode"
            class="qr-code"
            src="/gala/qrcode?name={{name}}"
        href="/gala/qrcode?name={{name}}"
        download="Event-QR-Code.png">
        <a class="download-btn" href="/gala/qrcode?name={{name}}">Download QR Code</a>
    </a>

    <div class="footer">
