<!DOCTYPE html>
<html lang="en">
<head>
<link rel="shortcut icon" type="image/x-icon" href="static/favicon.ico">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NuBuild Items</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* Header */
.header {
  display: flex;
  align-items: center;
  padding: 12px;
  background: #ffffff;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.back-btn {
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
}

/* Content */
.container {
  padding: 16px;
  flex: 1;
  margin-bottom: 50px;
}

.card {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.field {
  margin-bottom: 12px;
}

.label {
  font-size: 14px;
  color: #666;
}

.value {
  font-size: 18px;
  font-weight: bold;
}

/* Input section */
.update-section {
  display: flex;
  gap: 8px;
}

input {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ddd;
  font-size: 16px;
}

.update-btn {
  background: #0078D4;
  color: white;
  border: none;
  padding: 10px 14px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 60px;
  background-color: #333;
  color: white;
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: 1000;
  background: #ffffff;
}

.text-inp {
  flex: 1; 
  padding: 8px;
}

.action-btn {
  flex: 1;
  margin: 0 4px;
  padding: 10px;
  border: none;
  border-radius: 10px;
  font-size: 12px;
  color: white;
  cursor: pointer;
}

.child-list {
list-style: none;
padding: 0;
}

.child-item {
display: flex;
justify-content: space-between;
align-items: center;
padding: 10px;
border-bottom: 1px solid #ddd;
}

.child-item:last-child {
border-bottom: none;
}

.create { background: #28a745; }

.receive { background: #28a745; }
.move { background: #dc3545; }
.stage { background: #ffc107; color: black; }
.qr { background: #17a2b8; }

.error-message {
  font-size: 14px;
  color: #ff0000;
}

.success-message {
  font-size: 14px;
  color: #00ff00;
}

@media (max-width: 480px) {
  .value {
    font-size: 16px;
  }
}
</style>
</head>

<body>
{% include "Header.html" %}

<div class="container">

  <div class="card">
    <div class="field">
      <div class="label">Roles</div>
	
	{% with search_list_id="role", item_type="Role", material_children=role_objs, hide_by_default=false, call_api=false %}
    {% include "SearchableSubitems.html" %}
	{% endwith %}
	
    </div>
	
	<div class="error-message" id="receive_error">Please make sure all inputs are filled.</div>
	<div class="success-message" id="receive_success">Edit successful.</div>
	
	<input class="text-inp" type="text" id="newRoleNameInput" placeholder="Enter new role name"/>
    <button class="action-btn create" type="button" onclick="create_new_role()">Create</button>

</div>

<div class="bottom-bar">
</div>

<script>

async function create_new_role() {
	let role_name_inp = document.getElementById("newRoleNameInput");
	let value = role_name_inp.value;
	let url = "/api/createRole";
	const data = {
	"role_name": value
	};
	let ret = await post_request(url, data);
	let response_data = await ret.json();
	
	if (!ret.ok) {
		console.log("Displaying error " + response_data['error']);
		display_generic_error(response_data['error']);
	} else {
		display_generic_success("Role added!");
		//history.back();
		window.location.reload();
	}
	
	console.log(response_data);
}

function handleButtonUrl(action, open_new_window) {
			if (open_new_window) {
				window.open(action, '_blank');
			} else {
				window.location.href = action
			}
        }
		
function showChildSite(display_name, site_id) {
	const element = document.getElementById("ExampleChild");
	const new_elem = element.cloneNode(true);
	element.after(new_elem);
}


function display_generic_error(error_text) {
  const error_elem = document.getElementById("receive_error");
  error_elem.textContent = error_text;
  error_elem.style.display = "";
  
  hide_all_successes();
}

function display_generic_success(success_text) {
  const success_elem = document.getElementById("receive_success");
  success_elem.textContent = success_text;
  success_elem.style.display = "";
  
  hide_all_errors();
}
		
function hide_all_errors() {
error_elems = document.getElementsByClassName("error-message");
for (i = 0; i < error_elems.length; i++) {
	a = error_elems[i];
	a.style.display = "none";
}
}
  
function hide_all_successes() {
error_elems = document.getElementsByClassName("success-message");
for (i = 0; i < error_elems.length; i++) {
	a = error_elems[i];
	a.style.display = "none";
}
}

{% include "Request.js" %}

hide_all_errors();
hide_all_successes();

</script>

</body>
</html>
