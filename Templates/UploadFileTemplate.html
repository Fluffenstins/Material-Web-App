<html>
<head>
    <style>
        .form_card {
			font-family: Arial, sans-serif;
			background-color: lightblue;
            text-align: center;
			border-radius: 15px;
			padding: 5px;
        }
		.form_submit_button {
			flex: 1;
			margin: 5px;
			padding: 10px;
			border: none;
			border-radius: 10px;
			font-size: 12px;
			color: white;
			cursor: pointer;
			background: linear-gradient(135deg, #28a745, #48c745);
			box-shadow: 0 3px 8px rgba(79, 70, 229, 0.25);
		}

		.form_file_button {
			background: linear-gradient(135deg, #b6afc9, #d9d1f0);
			color: white;
			margin: 5px;
			padding: 10px 18px;
			border-radius: 8px;
			cursor: pointer;
			font-weight: 600;
			transition: all 0.2s ease;
			box-shadow: 0 3px 8px rgba(79, 70, 229, 0.25);
		}
    </style>
</head>

<body>
	<div class="form_card">
		<form action="/uploadFile" method="POST" enctype="multipart/form-data">
		  
		  <label for="file-upload">Choose a file to upload:</label>
		  <input type="hidden" name="parent_id" value="{{file_parent_id}}">
		  <input type="hidden" name="redirect_url" value="{{redirect_url}}">
		  <br>
		  <input class="form_file_button" type="file" id="file-upload" name="uploaded_file">
		  <br>
		  <button class="form_submit_button" type="submit">Submit File</button>
		</form>
	</div>
</body>

<script>
  const filePicker = document.getElementById('file-upload');
  const maxAllowedSize = 0.5 * 1024 * 1024; // 5MB in bytes

  filePicker.addEventListener('change', function() {
    if (this.files.length > 0) {
      const fileSize = this.files[0].size; // Size in bytes
      
      if (fileSize > maxAllowedSize) {
        alert('File is too large! Maximum allowed size is 5MB.');
        this.value = ''; // Clear the selection
      }
    }
  });
</script>
</html>
