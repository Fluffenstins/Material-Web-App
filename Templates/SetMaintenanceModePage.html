<!DOCTYPE html>
<html lang="en">
<head>
<link rel="shortcut icon" type="image/x-icon" href="static/favicon.ico">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NuBuild Create Site</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* Header */
.header {
  display: flex;
  align-items: center;
  padding: 12px;
  background: #ffffff;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.back-btn {
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
}

/* Content */
.container {
  padding: 16px;
  flex: 1;
  margin-bottom: 50px;
}

.card {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.field {
  margin-bottom: 12px;
}

.label {
  font-size: 14px;
  color: #666;
}

.value {
  font-size: 18px;
  font-weight: bold;
}

.maintenance-on-btn {
  margin-top: 40px;	
  background: #DB2721;
  color: white;
  border: none;
  padding: 10px 14px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  text-align: center;
}

.maintenance-off-btn {
  margin-top: 40px;	
  background: #51F59F;
  color: white;
  border: none;
  padding: 10px 14px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  text-align: center;
}


.error-message {
  font-size: 14px;
  color: #ff0000;
}

.success-message {
  font-size: 14px;
  color: #00ff00;
}



</style>
</head>

<body>
{% include "Header.html" %}

<div class="container">

  <div class="card">
	
	<div class="error-message" id="receive_error">Please make sure all inputs are filled.</div>
	<div class="success-message" id="receive_success">Mode set successfully.</div>
	<div class="maintenance-off-btn" id="maintenance_off_button" onclick="submitMaintenance(false)">Maintenance Off</div>
	<div class="maintenance-on-btn" id="maintenance_on_button" onclick="submitMaintenance(true)">Maintenance On</div>

</div>

<div class="bottom-bar">
</div>

<script>
function handleButtonUrl(action, open_new_window) {
			if (open_new_window) {
				window.open(action, '_blank');
			} else {
				window.location.href = action
			}
        }
		
function showChildSite(display_name, site_id) {
	const element = document.getElementById("ExampleChild");
	const new_elem = element.cloneNode(true);
	element.after(new_elem);
}

function display_generic_error(error_text) {
  const error_elem = document.getElementById("receive_error");
  error_elem.textContent = error_text;
  error_elem.style.display = "";
  
  hide_all_successes();
}

function display_generic_success(success_text) {
  const success_elem = document.getElementById("receive_success");
  success_elem.textContent = success_text;
  success_elem.style.display = "";
  
  hide_all_errors();
}
		
async function submitMaintenance(state) {
console.log("Attempting to set maintenance mode.");
	console.log(state);
	
	const data = {
	"state": state
	};
	let ret = await post_request("/api/setMaintenanceMode", data);
	let response_data = await ret.json();
	
	if (!ret.ok) {
		console.log("Displaying error " + response_data['error']);
		display_generic_error(response_data['error']);
	} else {
		display_generic_success("Creation successful!");
		//history.back();
		window.location.replace(document.referrer);
	}
	
	console.log(response_data);
}

{% include "Request.js" %}
  
function hide_all_errors() {
error_elems = document.getElementsByClassName("error-message");
for (i = 0; i < error_elems.length; i++) {
	a = error_elems[i];
	a.style.display = "none";
}
}
  
function hide_all_successes() {
error_elems = document.getElementsByClassName("success-message");
for (i = 0; i < error_elems.length; i++) {
	a = error_elems[i];
	a.style.display = "none";
}
}

hide_all_errors();
hide_all_successes();
</script>

</body>
</html>
